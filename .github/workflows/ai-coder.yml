name: AI Coder Agent
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: write
jobs:
  code:
    if: contains(github.event.issue.title, '[AI]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OpenRouter AI Coder
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOAL: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > /tmp/run_ai.py
          import os, json, urllib.request, urllib.error, glob
          paths = sorted(glob.glob("Makefile") + glob.glob("core/*.[ch]") + glob.glob("ios/**/*.swift", recursive=True))[:10]
          files = {p: open(p, errors="ignore").read()[:4000] for p in paths}
          prompt = "Goal:\n" + os.environ["GOAL"] + "\n\nRepo files:\n" + json.dumps(files) + "\n\nReturn ONLY a valid JSON object mapping file paths to complete updated file contents."
          payload = json.dumps({"model": "openai/gpt-4o-mini", "stream": False, "response_format": {"type": "json_object"}, "messages": [{"role": "user", "content": prompt}]}).encode()
          headers = {"Authorization": "Bearer " + os.environ["KEY"].strip(), "Content-Type": "application/json", "User-Agent": "Mozilla/5.0", "HTTP-Referer": "https://github.com"}
          req = urllib.request.Request("https://openrouter.ai", data=payload, headers=headers)
          raw = urllib.request.urlopen(req, timeout=120).read().decode("utf-8-sig").strip()
          print("RAW_HEAD:", repr(raw[:300]))
          res = json.loads(raw)
          if "error" in res: raise RuntimeError(str(res["error"]))
          txt = next(iter(res["choices"]))["message"]["content"].strip()
          for path, content in json.loads(txt).items():
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              open(path, "w").write(content)
          EOF
          python3 -c "import textwrap; open('/tmp/clean.py','w').write(textwrap.dedent(open('/tmp/run_ai.py').read()))"
          python3 /tmp/clean.py
      - uses: peter-evans/create-pull-request@v6
        with:
          title: "AI Auto-Patch: Debian EL2 KVM & ISO Boot"
          branch: ai-debian-kvm
